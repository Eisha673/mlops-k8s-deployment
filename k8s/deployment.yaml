apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-model-deployment
  labels:
    app: iris-model
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iris-model
  template:
    metadata:
      labels:
        app: iris-model
    spec:
      containers:
      - name: iris-model
        image: iris-model-service:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: iris-model-service
spec:
  selector:
    app: iris-model
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-model-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: iris.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iris-model-service
            port:
              number: 80
